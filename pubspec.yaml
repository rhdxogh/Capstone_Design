name: jikgwan_mate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.1
  table_calendar: ^3.1.0
  fl_chart: ^0.66.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.0
  firebase_storage: ^12.0.0
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
          
  assets:
    - assets/
    - assets/logo_red.png
    - assets/logo_black_font.png
    - assets/team_logo_img/
    - assets/stadium_img/
    - assets/view_img/
    - assets/lineup_img/
    - assets/etc/
    - assets/data/
    - assets/weather_img/
    - assets/mascot_img/
    # Overlays
    - assets/overlays/
    - assets/overlays/MUNHAK/
    - assets/overlays/CHANGWON/
    - assets/overlays/DAEGU/
    - assets/overlays/DAEJEON/
    - assets/overlays/GOCHEOK/
    - assets/overlays/GWANGJU/
    - assets/overlays/JAMSIL/
    - assets/overlays/SAJIK/
    - assets/overlays/SUWON/
    # Foods
    - assets/food_img/
    - assets/food_img/MUNHAK/
    - assets/food_img/CHANGWON/
    - assets/food_img/DAEGU/
    - assets/food_img/DAEJEON/
    - assets/food_img/GOCHEOK/
    - assets/food_img/GWANGJU/
    - assets/food_img/JAMSIL/
    - assets/food_img/SAJIK/
    - assets/food_img/SUWON/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_red.png"
  min_sdk_android: 21

  adaptive_icon_background: "#C40D0F"
  adaptive_icon_foreground: "assets/logo_red.png"